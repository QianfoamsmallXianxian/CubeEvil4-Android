name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/local/lib/android/sdk/ndk 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NDK, CMake and Build-Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platforms;android-35" \
            "build-tools;35.0.0" 2>&1 | tail -5

      - name: Verify Java Environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Gradle & CMake Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            port/android-decomp/.cxx
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Clean Previous Builds
        working-directory: port/android-decomp
        run: |
          rm -rf app/build
          rm -rf .cxx
          rm -rf build

      - name: Grant Execute Permission
        run: chmod +x port/android-decomp/gradlew

      - name: Build Debug APK
        working-directory: port/android-decomp
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cubeevil4-debug-${{ github.sha }}
          path: port/android-decomp/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
